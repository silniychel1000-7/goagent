global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "go-agent"
    static_configs:
      - targets:
          - "host.docker.internal:9100"
